<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>机制调整面板</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
      --warn: #b45309;
      --ok: #047857;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, #e8eef2 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px 32px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
    }
    header h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    nav { margin-top: 12px; }
    nav a { color: var(--accent); margin-right: 16px; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      padding: 20px 32px 40px;
      max-width: 1200px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px 16px;
      color: var(--muted); font-size: 0.9rem; margin-bottom: 12px;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: var(--ok);
      font-size: 0.8rem;
    }
    .pill.warn { background: #fff7ed; color: var(--warn); }
    .pill.bad { background: #fef2f2; color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
    .changed { background: #fffbeb; }
    .empty { color: var(--muted); font-size: 0.9rem; }
    .full { grid-column: 1 / -1; }
    .list-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .list-item:last-child { border-bottom: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }
    button.refresh {
      margin-top: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
    button.refresh:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>机制调整面板</h1>
    <p>查看当前机制参数、相对基线的改动，以及 proposal / model 状态。不做复杂编辑——改参请用 CLI 或 JSON。</p>
    <nav>
      <a href="/">结果列表</a>
      <a href="/mechanism">机制面板</a>
      <a href="http://127.0.0.1:5001/" target="_blank" rel="noopener">地图回放 (5001)</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>当前生效配置</h2>
      <div class="meta" id="active-meta">加载中…</div>
      <table>
        <thead><tr><th>参数</th><th>当前值</th><th>基线</th></tr></thead>
        <tbody id="key-params"></tbody>
      </table>
      <button class="refresh" onclick="loadAll()">刷新</button>
    </section>

    <section class="card">
      <h2>相对基线的改动</h2>
      <p class="empty" id="diff-summary"></p>
      <table>
        <thead><tr><th>路径</th><th>基线</th><th>当前</th></tr></thead>
        <tbody id="diff-body"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Model Versions</h2>
      <div id="models" class="empty">加载中…</div>
    </section>

    <section class="card">
      <h2>Proposals（草稿）</h2>
      <div id="proposals" class="empty">加载中…</div>
    </section>

    <section class="card full">
      <h2>最近实验结果（便于对照改动效果）</h2>
      <p class="empty">选择已有仿真结果，看健康分走势是否符合预期。</p>
      <div class="meta">
        <label>场景
          <select id="scenario-select"><option value="">（加载中）</option></select>
        </label>
        <a id="scenario-link" href="#" style="display:none">打开详情</a>
      </div>
      <canvas id="health-chart" height="120"></canvas>
      <p class="empty" id="chart-note"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    let chart;

    function fmt(v) {
      if (v === null || v === undefined) return "—";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    async function loadAll() {
      const res = await fetch("/api/mechanism/overview");
      const data = await res.json();
      renderActive(data);
      renderDiff(data);
      renderModels(data.models || []);
      renderProposals(data.proposals || []);
      fillScenarios(data.scenarios || []);
    }

    function renderActive(data) {
      const meta = data.active_meta || {};
      const model = data.active_model_id || "（未绑定 model）";
      document.getElementById("active-meta").innerHTML = `
        <span>active.json version: <b class="mono">${meta.version_id || "—"}</b></span>
        <span>name: <b>${meta.name || "—"}</b></span>
        <span>model: <b class="mono">${model}</b></span>
        <span class="pill">${data.change_count || 0} 处相对基线变化</span>
      `;
      const tbody = document.getElementById("key-params");
      tbody.innerHTML = "";
      (data.key_params || []).forEach(row => {
        const tr = document.createElement("tr");
        if (row.changed) tr.className = "changed";
        tr.innerHTML = `<td class="path">${row.path}</td><td>${fmt(row.current)}</td><td>${fmt(row.baseline)}</td>`;
        tbody.appendChild(tr);
      });
    }

    function renderDiff(data) {
      const changes = data.diff_changes || {};
      const keys = Object.keys(changes);
      document.getElementById("diff-summary").textContent =
        keys.length ? `共 ${keys.length} 项与 v0_baseline 不同（最多显示 40）` : "与基线一致，无差异";
      const tbody = document.getElementById("diff-body");
      tbody.innerHTML = "";
      keys.slice(0, 40).forEach(path => {
        const pair = changes[path];
        const tr = document.createElement("tr");
        tr.className = "changed";
        tr.innerHTML = `<td class="path">${path}</td><td>${fmt(pair.a)}</td><td>${fmt(pair.b)}</td>`;
        tbody.appendChild(tr);
      });
    }

    function statusPill(status) {
      const s = (status || "").toLowerCase();
      let cls = "pill";
      if (s.includes("fail") || s === "rejected") cls += " bad";
      else if (s === "draft" || s === "proposed") cls += " warn";
      return `<span class="${cls}">${status || "—"}</span>`;
    }

    function renderModels(models) {
      const el = document.getElementById("models");
      if (!models.length) { el.textContent = "暂无 model 版本"; return; }
      el.innerHTML = models.slice(0, 12).map(m => `
        <div class="list-item">
          ${m.active ? "★ " : ""}
          <span class="mono">${m.id}</span>
          ${statusPill(m.status)}
          <div>${m.name || ""} <span style="color:#6b7280">${m.note || ""}</span></div>
        </div>
      `).join("");
    }

    function renderProposals(proposals) {
      const el = document.getElementById("proposals");
      if (!proposals.length) { el.textContent = "暂无 proposal"; return; }
      el.innerHTML = proposals.slice().reverse().slice(0, 12).map(p => `
        <div class="list-item">
          <span class="mono">${p.id}</span>
          ${statusPill(p.status)}
          <div>${p.name || ""} · ${p.created_by || ""}</div>
        </div>
      `).join("");
    }

    function fillScenarios(scenarios) {
      const sel = document.getElementById("scenario-select");
      sel.innerHTML = '<option value="">选择场景…</option>';
      scenarios.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      sel.onchange = () => loadChart(sel.value);
    }

    async function loadChart(name) {
      const note = document.getElementById("chart-note");
      const link = document.getElementById("scenario-link");
      if (!name) {
        note.textContent = "";
        link.style.display = "none";
        if (chart) chart.destroy();
        return;
      }
      link.href = "/scenario/" + encodeURIComponent(name);
      link.style.display = "inline";
      link.textContent = "打开详情 →";
      const res = await fetch("/api/scenario/" + encodeURIComponent(name) + "/chart/health");
      const data = await res.json();
      if (data.error) {
        note.textContent = data.error;
        return;
      }
      note.textContent = `天数: ${(data.labels || []).length}`;
      const ctx = document.getElementById("health-chart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: data.labels,
          datasets: [{
            label: "健康分",
            data: data.scores,
            borderColor: "#0f766e",
            backgroundColor: "rgba(15,118,110,0.12)",
            tension: 0.2,
            fill: true,
            pointRadius: 2,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { suggestedMin: 0, suggestedMax: 100 } }
        }
      });
    }

    loadAll();
  </script>
</body>
</html>

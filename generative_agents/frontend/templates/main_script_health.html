<script type="text/javascript">
    // Initialize variables from Flask context
    let step = {{ step|tojson }};
    const stride_minutes = {{ sec_per_step|tojson }};
    let zoom = {{ zoom|tojson }};
    const hasExplicitZoom = zoom > 0;
    let autoFitEnabled = !hasExplicitZoom;
    let initialZoom = null;
    let mapPixelWidth = 0;
    let mapPixelHeight = 0;

    let tile_width = 32;
    const base_movement_speed = {{ play_speed|tojson }};
    let playbackSpeed = 1;
    let movement_speed = base_movement_speed;
    let execute_count_max = tile_width / movement_speed;
    let execute_count = execute_count_max;
    let all_movement = {{ all_movement|tojson }};
    const conversation_data = all_movement["conversation"] || {};
    const description_data = all_movement["description"] || {};

    let datetime_options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    let start_datetime = new Date(Date.parse({{ start_datetime|tojson }}));
    const initial_start_datetime = new Date(start_datetime.getTime());
    const framesPerStep = 60;
    const checkpointTimes = Object.keys(conversation_data).sort();
    let dayIndexByDate = new Map();
    let dayByStep = {};
    let totalDays = 0;
    let lastKnownHealthScore = null;
    let lastKnownSatisfactionScore = null;
    let activeProfileAgent = null;
    const agentProfiles = {};
    const agentRoles = {};

    // Map folder for dynamic asset loading
    let map_folder = {{ map_folder|default('village')|tojson }};

    // Persona related variables
    let persona_names = {{ persona_init_pos|tojson }};
    var spawn_tile_loc = {};
    for (var key in persona_names) {
        spawn_tile_loc[key] = persona_names[key];
    }

    var personas = {};
    var pronunciatios = {};
    let anims_direction;
    let pre_anims_direction;
    let pre_anims_direction_dict = {};

    let movement_target = {};

    let timelineSteps = [];
    let timelineNodes = [];
    let timelineNodeByStep = {};
    let activeTimelineNode = null;

    let finished = false;
    let paused = false;
    let camera;
    let cameraControls;

    const replayUI = {
        playBtn: null,
        pauseBtn: null,
        showConvBtn: null,
        hideConvBtn: null,
        speedSelect: null,
        timeEl: null,
        convEl: null,
    };

    // Camera drag state
    let isDragging = false;

    // Zoom limits
    const MIN_ZOOM = 0.1;
    const MAX_ZOOM = 3.0;
    const ZOOM_STEP = 0.15;
    const PAN_STEP = 100;  // Pixels to pan per button click

    // Health-specific: intervention level names
    const INTERVENTION_LEVELS = {
        0: { name: "观察", icon: "👁️" },
        1: { name: "劝说", icon: "💬" },
        2: { name: "移除物品", icon: "📦" },
        3: { name: "锁定空间", icon: "🔒" }
    };

    // Health zone translations
    const ZONE_TRANSLATIONS = {
        "SAFE": "安全",
        "NORMAL": "正常",
        "WARNING": "警告",
        "DANGER": "危险",
        "EMERGENCY": "紧急"
    };

    // Tide phase translations
    const TIDE_TRANSLATIONS = {
        "recovery": { text: "恢复期", icon: "🌅" },
        "plateau": { text: "平台期", icon: "🏔️" },
        "relapse": { text: "复发期", icon: "🌧️" },
        "normal": { text: "正常期", icon: "🌊" },
        "deep_recovery": { text: "深度恢复期", icon: "☀️" }
    };

    function buildDayIndexMap() {
        dayIndexByDate = new Map();
        let nextIndex = 1;
        checkpointTimes.forEach((timeKey) => {
            if (!timeKey || typeof timeKey !== "string") return;
            const datePart = timeKey.split("-")[0];
            if (!datePart) return;
            if (!dayIndexByDate.has(datePart)) {
                dayIndexByDate.set(datePart, nextIndex++);
            }
        });
    }

    function computeTotalDaysFromMovement() {
        let maxDay = 0;
        for (const stepKey in all_movement) {
            if (stepKey === "description" || stepKey === "conversation") continue;
            const stepData = all_movement[stepKey];
            if (!stepData) continue;
            for (const agentName in stepData) {
                if (agentName === "description" || agentName === "conversation") continue;
                const numericDay = toNumber(stepData[agentName].day);
                if (Number.isFinite(numericDay) && numericDay > maxDay) {
                    maxDay = numericDay;
                }
            }
        }
        return maxDay;
    }

    function formatDisciplineLevel(level) {
        const mapping = {
            "very_low": "很低",
            "low": "低",
            "medium": "中等",
            "high": "高",
            "very_high": "很高",
        };
        return mapping[level] || level || "";
    }

    function toNumber(value) {
        const num = Number(value);
        return Number.isFinite(num) ? num : null;
    }

    function getDayForFrameStep(frameStep, stepData) {
        if (!Number.isFinite(frameStep) || frameStep < 1) return null;
        let dayValue = null;
        if (stepData) {
            const numericDay = toNumber(stepData.day);
            if (Number.isFinite(numericDay) && numericDay > 0) {
                dayValue = numericDay;
            }
        }
        if (!dayValue) {
            const timeKey = getTimeKeyForFrameStep(frameStep);
            if (timeKey) {
                const datePart = timeKey.split("-")[0];
                if (dayIndexByDate.has(datePart)) {
                    dayValue = dayIndexByDate.get(datePart);
                }
            }
        }
        return dayValue;
    }

    function updateTotalDaysUI() {
        const totalEl = document.getElementById("total-days");
        if (!totalEl) return;
        if (!totalDays || totalDays < 1) {
            totalEl.innerText = "--";
        } else {
            totalEl.innerText = totalDays;
        }
    }

    function extractSatisfactionScore(stepData) {
        if (!stepData) return null;
        const candidates = [
            stepData.satisfaction_score,
            stepData.emotion_score,
            stepData.satisfaction
        ];
        for (const value of candidates) {
            const numericValue = toNumber(value);
            if (Number.isFinite(numericValue)) {
                return numericValue;
            }
        }
        return null;
    }

    function formatScore(value) {
        if (!Number.isFinite(value)) return "--";
        return value.toFixed(1);
    }

    function isInterventionAgent(agentData, interventionAction) {
        if (!agentData) return false;
        if (!interventionAction) return false;
        const action = agentData.action || "";
        return action === interventionAction || action.includes(interventionAction);
    }

    function getRoleLabel(agentName, agentData, currentLevel, currentAction) {
        const profileRole = agentProfiles[agentName] ? agentProfiles[agentName].roleLabel : "";
        let baseRole = agentRoles[agentName] || profileRole || "";
        if (!baseRole && agentData && agentData.role) {
            baseRole = agentData.role;
        }
        if (!baseRole) {
            baseRole = "角色";
        }
        const levelLabel = Number.isFinite(currentLevel) ? `L${currentLevel + 1}` : "";
        if (currentLevel > 0 && isInterventionAgent(agentData, currentAction)) {
            return `${baseRole} · ${levelLabel}`;
        }
        return baseRole;
    }

    function setSidebarText(id, text) {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerText = text;
    }

    function truncateText(text, maxLen) {
        if (!text) return "-";
        if (text.length <= maxLen) return text;
        return text.substring(0, maxLen - 3) + "...";
    }

    function renderAgentProfile(agentName) {
        const nameEl = document.getElementById("agent-profile-name");
        const bodyEl = document.getElementById("agent-profile-body");
        if (!nameEl || !bodyEl) return;

        if (!agentName) {
            nameEl.innerText = "-";
            bodyEl.innerText = "点击头像查看详细信息";
            return;
        }

        activeProfileAgent = agentName;
        nameEl.innerText = agentName;

        const profile = agentProfiles[agentName] || {};
        const rows = [];

        if (profile.roleLabel) rows.push(["角色", profile.roleLabel]);
        if (profile.lifestyle) rows.push(["生活方式", profile.lifestyle]);
        if (profile.selfDiscipline) rows.push(["自律等级", profile.selfDiscipline]);
        if (profile.personality) rows.push(["性格", profile.personality]);
        if (profile.background) rows.push(["背景", profile.background]);
        if (profile.healthCondition) rows.push(["健康状况", profile.healthCondition]);
        if (profile.forbiddenActivities) rows.push(["禁忌", profile.forbiddenActivities]);
        if (profile.motivation) rows.push(["动机", profile.motivation]);
        if (profile.strategyPreference) rows.push(["管理风格", profile.strategyPreference]);
        if (profile.supervisedAgents) rows.push(["监督对象", profile.supervisedAgents]);
        if (profile.supervisor) rows.push(["监督者", profile.supervisor]);
        if (profile.dailyPlan) rows.push(["日程", profile.dailyPlan]);
        if (profile.currently) rows.push(["当前画像", profile.currently]);

        if (!rows.length) {
            bodyEl.innerText = "暂无详细信息";
            return;
        }

        bodyEl.innerHTML = rows.map(([label, value]) => {
            return `<div class="profile-row"><div class="profile-label">${label}</div><div class="profile-value">${value}</div></div>`;
        }).join("");
    }

    function bindAgentProfileClicks() {
        const rows = document.querySelectorAll(".agent-row");
        rows.forEach((row) => {
            row.addEventListener("click", () => {
                const agentName = row.dataset.agent;
                renderAgentProfile(agentName);
            });
            row.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    const agentName = row.dataset.agent;
                    renderAgentProfile(agentName);
                }
            });
        });
    }

    function loadAgentProfiles() {
        const agentNames = Object.keys(persona_names || {});
        const requests = agentNames.map((agentName) => {
            const encoded = encodeURIComponent(agentName);
            const url = `/static/assets/${map_folder}/agents/${encoded}/agent.json`;
            return fetch(url)
                .then((res) => res.ok ? res.json() : null)
                .then((data) => {
                    if (!data) return;
                    const monitor = data.monitor || {};
                    const scratch = data.scratch || {};
                    const role = monitor.role || "";
                    const roleLabel = role === "supervised"
                        ? "被管理者"
                        : role === "supervisor"
                            ? "管理者"
                            : role === "intervention"
                                ? "干预者"
                                : "";
                    agentRoles[agentName] = roleLabel || agentRoles[agentName];

                    const healthStatus = monitor.health_status || {};
                    const forbidden = healthStatus.forbidden_activities || healthStatus.forbidden_foods || [];
                    agentProfiles[agentName] = {
                        roleLabel,
                        lifestyle: scratch.lifestyle,
                        selfDiscipline: formatDisciplineLevel(monitor.self_discipline),
                        personality: scratch.innate,
                        background: scratch.learned,
                        healthCondition: healthStatus.condition,
                        motivation: scratch.motivation,
                        strategyPreference: monitor.strategy_preference,
                        supervisedAgents: Array.isArray(monitor.supervised_agents) ? monitor.supervised_agents.join("、") : "",
                        supervisor: monitor.supervisor,
                        dailyPlan: scratch.daily_plan,
                        currently: data.currently,
                        forbiddenActivities: Array.isArray(forbidden) ? forbidden.join("、") : ""
                    };
                })
                .catch(() => null);
        });

        Promise.all(requests).then(() => {
            if (!activeProfileAgent) {
                const target = agentNames.find(name => (agentProfiles[name] || {}).roleLabel === "被管理者");
                renderAgentProfile(target || agentNames[0]);
            } else {
                renderAgentProfile(activeProfileAgent);
            }
        });
    }

    // Update health panel function
    function updateHealthPanel(stepKey) {
        // Find target agent data (first agent in step)
        if (!all_movement[stepKey]) return;

        let targetData = null;
        let targetName = null;
        const stepData = all_movement[stepKey];

        for (let agentName in stepData) {
            if (agentName === "description" || agentName === "conversation") continue;
            const profile = agentProfiles[agentName];
            if (profile && profile.roleLabel === "被管理者") {
                targetData = stepData[agentName];
                targetName = agentName;
                break;
            }
        }

        if (!targetData) {
            for (let agentName in stepData) {
                if (agentName !== "description" && agentName !== "conversation") {
                    targetData = stepData[agentName];
                    targetName = agentName;
                    break;
                }
            }
        }

        if (!targetData) return;

        // Update day
        const frameStep = Number(stepKey);
        let dayValue = getDayForFrameStep(frameStep, targetData);
        if (Number.isFinite(dayValue)) {
            document.getElementById("current-day").innerText = dayValue;
        } else {
            document.getElementById("current-day").innerText = "--";
        }
        updateTotalDaysUI();

        // Update health score
        let healthScore = targetData.health_score;
        const numericHealthScore = toNumber(healthScore);
        if (Number.isFinite(numericHealthScore)) {
            lastKnownHealthScore = numericHealthScore;
        }
        document.getElementById("health-score").innerText = formatScore(lastKnownHealthScore);

        // Update satisfaction score
        const satisfactionScore = extractSatisfactionScore(targetData);
        if (Number.isFinite(satisfactionScore)) {
            lastKnownSatisfactionScore = satisfactionScore;
        }
        const satisfactionEl = document.getElementById("satisfaction-score");
        if (satisfactionEl) {
            satisfactionEl.innerText = formatScore(lastKnownSatisfactionScore);
        }

        // Update health zone
        let zone = targetData.health_zone || "NORMAL";
        let zoneEl = document.getElementById("health-zone");
        zoneEl.innerText = ZONE_TRANSLATIONS[zone] || zone;
        zoneEl.className = "zone-badge zone-" + zone.toLowerCase();

        // Update tide phase
        let tidePhase = targetData.tide_phase || "normal";
        let tideInfo = TIDE_TRANSLATIONS[tidePhase] || { text: tidePhase, icon: "🌊" };
        document.getElementById("tide-phase").innerText = tideInfo.text;
        document.getElementById("tide-icon").innerText = tideInfo.icon;

        // Update intervention level
        let level = toNumber(targetData.intervention_level) || 0;
        let levelInfo = INTERVENTION_LEVELS[level] || INTERVENTION_LEVELS[0];

        let levelIndicator = document.getElementById("level-indicator");
        levelIndicator.innerText = `L${level + 1}`;
        levelIndicator.className = "level-indicator level-" + level;

        document.getElementById("level-name").innerText = levelInfo.name;

        let rawLevelAction = targetData.intervention_action || "";
        let levelAction = rawLevelAction || "-";
        document.getElementById("level-action").innerText = levelAction;

        // Update sidebar agent activities
        for (let agentName in stepData) {
            if (agentName === "description" || agentName === "conversation") continue;

            let agentData = stepData[agentName];
            const roleText = getRoleLabel(agentName, agentData, level, rawLevelAction);
            setSidebarText("sidebar-role-" + agentName, roleText);

            let location = agentData.location || "-";
            setSidebarText("sidebar-location-" + agentName, `位置：${location}`);

            let action = agentData.action || "-";
            const actionEl = document.getElementById("sidebar-action-" + agentName);
            if (actionEl) {
                actionEl.innerText = `动作：${truncateText(action, 36)}`;
                actionEl.title = action;
            }
        }
    }

    function setActive(el, active) {
        if (!el) return;
        if (active) {
            el.classList.add("active");
        } else {
            el.classList.remove("active");
        }
    }

    function updateReplayUIState() {
        if (!replayUI.playBtn || !replayUI.pauseBtn) return;

        if (finished) {
            replayUI.playBtn.textContent = "回放结束";
            replayUI.playBtn.disabled = true;
            replayUI.pauseBtn.disabled = true;
            setActive(replayUI.playBtn, false);
            setActive(replayUI.pauseBtn, false);
        } else {
            replayUI.playBtn.textContent = "运行";
            replayUI.pauseBtn.textContent = "暂停";
            replayUI.playBtn.disabled = false;
            replayUI.pauseBtn.disabled = false;
            setActive(replayUI.playBtn, !paused);
            setActive(replayUI.pauseBtn, paused);
        }

        if (replayUI.convEl && replayUI.showConvBtn && replayUI.hideConvBtn) {
            const visible = replayUI.convEl.style.display !== "none";
            setActive(replayUI.showConvBtn, visible);
            setActive(replayUI.hideConvBtn, !visible);
        }
    }

    function applyPlaybackSpeed(nextSpeed) {
        const speedValue = Number(nextSpeed);
        if (!Number.isFinite(speedValue) || speedValue <= 0) return;
        if (speedValue === playbackSpeed) return;

        const previousMax = execute_count_max;
        const progressRatio = previousMax > 0 ? execute_count / previousMax : 1;

        playbackSpeed = speedValue;
        movement_speed = base_movement_speed * playbackSpeed;
        execute_count_max = tile_width / movement_speed;
        execute_count = Math.max(1, Math.round(execute_count_max * progressRatio));

        if (window.phaserSceneRef && window.phaserSceneRef.anims) {
            window.phaserSceneRef.anims.globalTimeScale = playbackSpeed;
        }
    }

    function getCheckpointIndexForFrameStep(frameStep) {
        if (!Number.isFinite(frameStep) || frameStep < 1) return 0;
        return Math.floor((frameStep - 1) / framesPerStep);
    }

    function getTimeKeyForFrameStep(frameStep) {
        const idx = getCheckpointIndexForFrameStep(frameStep);
        if (idx >= 0 && idx < checkpointTimes.length) {
            return checkpointTimes[idx];
        }
        return null;
    }

    function parseTimeKey(timeKey) {
        if (!timeKey || typeof timeKey !== "string") return null;
        const parts = timeKey.split("-");
        if (parts.length !== 2) return null;
        const datePart = parts[0];
        const timePart = parts[1];
        if (datePart.length !== 8) return null;
        const year = Number(datePart.slice(0, 4));
        const month = Number(datePart.slice(4, 6));
        const day = Number(datePart.slice(6, 8));
        const timePieces = timePart.split(":");
        if (timePieces.length !== 2) return null;
        const hour = Number(timePieces[0]);
        const minute = Number(timePieces[1]);
        if (![year, month, day, hour, minute].every(Number.isFinite)) return null;
        return new Date(year, month - 1, day, hour, minute);
    }

    function formatTimeKey(timeKey) {
        const parsed = parseTimeKey(timeKey);
        if (!parsed) return timeKey || "--:--";
        const year = parsed.getFullYear().toString().padStart(4, "0");
        const month = (parsed.getMonth() + 1).toString().padStart(2, "0");
        const day = parsed.getDate().toString().padStart(2, "0");
        const hour = parsed.getHours().toString().padStart(2, "0");
        const minute = parsed.getMinutes().toString().padStart(2, "0");
        return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    function formatClockTime(dateObj) {
        if (!dateObj) return "--:--";
        const year = dateObj.getFullYear().toString().padStart(4, "0");
        const month = (dateObj.getMonth() + 1).toString().padStart(2, "0");
        const day = dateObj.getDate().toString().padStart(2, "0");
        const hour = dateObj.getHours().toString().padStart(2, "0");
        const minute = dateObj.getMinutes().toString().padStart(2, "0");
        return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    function getSimulatedTimeForFrameStep(frameStep) {
        const timeKey = getTimeKeyForFrameStep(frameStep);
        let baseTime = timeKey ? parseTimeKey(timeKey) : null;
        if (!baseTime) {
            const checkpointIndex = getCheckpointIndexForFrameStep(frameStep);
            baseTime = new Date(initial_start_datetime.getTime() + checkpointIndex * stride_minutes * 60 * 1000);
        }

        const frameOffset = (frameStep - 1) % framesPerStep;
        const intervalMs = (stride_minutes * 60 * 1000) / framesPerStep;
        return new Date(baseTime.getTime() + frameOffset * intervalMs);
    }

    function setReplayTimeForStep(frameStep) {
        if (!replayUI.timeEl) return;
        const simTime = getSimulatedTimeForFrameStep(frameStep);
        replayUI.timeEl.textContent = formatClockTime(simTime);
    }

    function updateTimelineActive(currentStep) {
        if (!timelineSteps.length) return;
        let targetStep = timelineSteps[0];
        for (let i = 0; i < timelineSteps.length; i++) {
            if (timelineSteps[i] <= currentStep) {
                targetStep = timelineSteps[i];
            } else {
                break;
            }
        }
        const node = timelineNodeByStep[String(targetStep)];
        if (!node) return;
        if (activeTimelineNode && activeTimelineNode !== node) {
            activeTimelineNode.classList.remove("active");
        }
        node.classList.add("active");
        activeTimelineNode = node;
    }

    function snapPersonasToStep(targetStep) {
        const stepData = all_movement[String(targetStep)];
        if (!stepData) return;

        for (const personaName in personas) {
            const lookupName = personaName.replace("_", " ");
            const agentData = stepData[lookupName];
            if (!agentData || !agentData.movement) continue;

            const newX = agentData.movement[0] * tile_width;
            const newY = agentData.movement[1] * tile_width;
            personas[personaName].body.x = newX;
            personas[personaName].body.y = newY;
            movement_target[personaName] = [newX, newY];

            if (pronunciatios[personaName]) {
                pronunciatios[personaName].x = newX - 15;
                pronunciatios[personaName].y = newY - 15 - 25;
            }
        }
    }

    function jumpToStep(targetStep) {
        if (!Number.isFinite(targetStep)) return;
        if (!all_movement[String(targetStep)]) return;

        step = targetStep;
        execute_count = execute_count_max;
        finished = false;
        paused = false;
        setReplayTimeForStep(targetStep);
        updateReplayUIState();
        updateHealthPanel(String(targetStep));
        snapPersonasToStep(targetStep);
        updateTimelineActive(targetStep);
    }

    function buildTimeline() {
        const timelineEl = document.getElementById("replay-timeline");
        const trackEl = document.getElementById("timeline-track");
        if (!timelineEl || !trackEl) return;

        if (!checkpointTimes.length) return;

        const timelineEntries = [];
        const dateIndexMap = new Map();
        let nextDateIndex = 1;

        for (let idx = 0; idx < checkpointTimes.length; idx++) {
            const frameStep = idx * framesPerStep + 1;
            if (!all_movement[String(frameStep)]) continue;

            const timeKey = checkpointTimes[idx];
            const datePart = timeKey ? timeKey.split("-")[0] : "";
            if (!dateIndexMap.has(datePart)) {
                dateIndexMap.set(datePart, nextDateIndex++);
            }
            const dayValue = dateIndexMap.get(datePart);

            timelineEntries.push({
                step: frameStep,
                timeKey,
                day: dayValue
            });
        }

        if (!timelineEntries.length) return;

        const dayMap = new Map();
        dayByStep = {};
        for (const entry of timelineEntries) {
            const dayKey = Number.isFinite(entry.day) ? entry.day : 1;
            if (!dayMap.has(dayKey)) {
                dayMap.set(dayKey, []);
            }
            dayMap.get(dayKey).push(entry);
            dayByStep[String(entry.step)] = dayKey;
        }

        const dayEntries = Array.from(dayMap.entries()).sort((a, b) => a[0] - b[0]);
        const timelineDays = dayEntries.length;
        if (!totalDays || totalDays < timelineDays) {
            totalDays = timelineDays;
        }
        updateTotalDaysUI();

        timelineSteps = [];
        timelineNodes = [];
        timelineNodeByStep = {};
        activeTimelineNode = null;
        trackEl.innerHTML = "";

        dayEntries.forEach(([dayValue, entries]) => {
            const dayWrap = document.createElement("div");
            dayWrap.className = "timeline-day";

            const label = document.createElement("div");
            label.className = "timeline-day-label";
            label.textContent = `第${dayValue}天`;
            dayWrap.appendChild(label);

            const stepsWrap = document.createElement("div");
            stepsWrap.className = "timeline-steps";

            entries.forEach((entry) => {
                const node = document.createElement("button");
                node.type = "button";
                node.className = "timeline-node";
                node.dataset.step = String(entry.step);
                node.title = `第${dayValue}天 ${formatTimeKey(entry.timeKey)}`;
                node.addEventListener("click", (event) => {
                    event.stopPropagation();
                    jumpToStep(entry.step);
                });
                stepsWrap.appendChild(node);
                timelineNodes.push(node);
                timelineSteps.push(entry.step);
                timelineNodeByStep[String(entry.step)] = node;
            });

            dayWrap.appendChild(stepsWrap);
            trackEl.appendChild(dayWrap);
        });

        timelineSteps.sort((a, b) => a - b);
        updateTimelineActive(step);
    }

    function bindReplayUI() {
        replayUI.playBtn = document.getElementById("replay-play");
        replayUI.pauseBtn = document.getElementById("replay-pause");
        replayUI.showConvBtn = document.getElementById("replay-show-conv");

        mapPixelWidth = map.widthInPixels;
        mapPixelHeight = map.heightInPixels;

        const clampZoom = (value) => Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));
        const applyZoom = (value) => camera.setZoom(clampZoom(value));
        const applyFitZoom = () => {
            if (!mapPixelWidth || !mapPixelHeight) return;
            const fitZoom = Math.min(
                camera.width / mapPixelWidth,
                camera.height / mapPixelHeight
            );
            applyZoom(fitZoom);
        };

        initialZoom = hasExplicitZoom ? zoom : Math.min(
            camera.width / mapPixelWidth,
            camera.height / mapPixelHeight
        );

        cursors = this.input.keyboard.createCursorKeys();
        this.input.keyboard.addCapture([
            Phaser.Input.Keyboard.KeyCodes.UP,
            Phaser.Input.Keyboard.KeyCodes.DOWN,
            Phaser.Input.Keyboard.KeyCodes.LEFT,
            Phaser.Input.Keyboard.KeyCodes.RIGHT,
        ]);
        cameraControls = new Phaser.Cameras.Controls.SmoothedKeyControl({
            camera: camera,
            left: cursors.left,
            right: cursors.right,
            up: cursors.up,
            down: cursors.down,
            acceleration: 0.06,
            drag: 0.0005,
            maxSpeed: 6.0
        });
        this.cameraControls = cameraControls;

        const fitToMap = () => {
            autoFitEnabled = true;
            applyFitZoom();
            camera.centerOn(mapPixelWidth / 2, mapPixelHeight / 2);
        };

        this.input.keyboard.on("keydown", (event) => {
            const key = event.key;
            if (key === "+" || key === "=") {
                event.preventDefault();
                autoFitEnabled = false;
                applyZoom(camera.zoom + ZOOM_STEP);
                return;
            }
            if (key === "-" || key === "_") {
                event.preventDefault();
                autoFitEnabled = false;
                applyZoom(camera.zoom - ZOOM_STEP);
                return;
            }
            if (key === "0") {
                event.preventDefault();
                if (hasExplicitZoom) {
                    autoFitEnabled = false;
                    applyZoom(initialZoom);
                } else {
                    fitToMap();
                }
                return;
            }
            if (key === "f" || key === "F") {
                event.preventDefault();
                fitToMap();
            }

        // Mouse wheel zoom
        this.input.on(Phaser.Input.Events.POINTER_WHEEL, (pointer, gameObjects, deltaX, deltaY, deltaZ, event) => {
            if (event) event.preventDefault();
            let newZoom = camera.zoom;
            if (deltaY > 0) {
                newZoom -= ZOOM_STEP;
            } else if (deltaY < 0) {
                newZoom += ZOOM_STEP;
            }
            autoFitEnabled = false;
            applyZoom(newZoom);
        });

        // Mouse drag to pan camera
        this.input.on(Phaser.Input.Events.POINTER_DOWN, (pointer) => {
            if (pointer.middleButtonDown() || (pointer.leftButtonDown() && pointer.event.shiftKey)) {
                isDragging = true;
            }
        });

        this.input.on(Phaser.Input.Events.POINTER_MOVE, (pointer) => {
            if (!isDragging) return;
            const dx = (pointer.prevPosition.x - pointer.position.x) / camera.zoom;
            const dy = (pointer.prevPosition.y - pointer.position.y) / camera.zoom;
            camera.scrollX += dx;
            camera.scrollY += dy;
        });

        this.input.on(Phaser.Input.Events.POINTER_UP, () => {
            isDragging = false;
        });
        this.input.on(Phaser.Input.Events.POINTER_UP_OUTSIDE, () => {
            isDragging = false;

                    border:"solid",
                    borderRadius:"10px"
                }

            pronunciatios[persona_name].alpha = 0.7;
        }

        const firstPersonaName = Object.keys(personas)[0];
        if (firstPersonaName && personas[firstPersonaName]) {
            camera.centerOn(personas[firstPersonaName].x, personas[firstPersonaName].y);
        } else {
            camera.centerOn(map.widthInPixels / 2, map.heightInPixels / 2);

        // Create animations
        const anims = this.anims;
        for (let i = 0; i < Object.keys(persona_names).length; i++) {
            let persona_name = Object.keys(persona_names)[i];
            let left_walk_name = persona_name + "-left-walk";
            let right_walk_name = persona_name + "-right-walk";
            let down_walk_name = persona_name + "-down-walk";
            let up_walk_name = persona_name + "-up-walk";

            frameRate = 4;
            if (movement_speed > 1) frameRate = 8;

            anims.create({
                key: left_walk_name,
                frames: anims.generateFrameNames(persona_name, { prefix: "left-walk.", start: 0, end: 3, zeroPad: 3 }),
                frameRate: frameRate,
                repeat: -1
            });

            anims.create({
                key: right_walk_name,
                frames: anims.generateFrameNames(persona_name, { prefix: "right-walk.", start: 0, end: 3, zeroPad: 3 }),
                frameRate: frameRate,
                repeat: -1
            });

            anims.create({
                key: down_walk_name,
                frames: anims.generateFrameNames(persona_name, { prefix: "down-walk.", start: 0, end: 3, zeroPad: 3 }),
                frameRate: frameRate,
                repeat: -1
            });

            anims.create({
                key: up_walk_name,
                frames: anims.generateFrameNames(persona_name, { prefix: "up-walk.", start: 0, end: 3, zeroPad: 3 }),
                frameRate: frameRate,
                repeat: -1
            });
        }

        if (this.anims) {
            this.anims.globalTimeScale = playbackSpeed;
        }

        bindReplayUI();

        // Initial health panel update
        buildDayIndexMap();
        const movementTotalDays = computeTotalDaysFromMovement();
        totalDays = movementTotalDays > 0 ? movementTotalDays : dayIndexByDate.size;
        updateTotalDaysUI();
        buildTimeline();
        updateHealthPanel(step.toString());
        bindAgentProfileClicks();
        loadAgentProfiles();
    }

    // Update function
    function update(time, delta) {
        const camera = this.mainCamera || this.cameras.main;
        if (this.cameraControls) {
            this.cameraControls.update(delta);
        }

        let curr_focused_persona = document.getElementById("temp_focus").textContent;
        if (curr_focused_persona != "") {
            const targetPersona = personas[curr_focused_persona];
            if (targetPersona && camera) {
                camera.pan(targetPersona.x, targetPersona.y, 300, "Power2");
            }
            document.getElementById("temp_focus").innerHTML = "";
        }

        if (finished || paused) {
            return;
        }

        const conversation_key = getTimeKeyForFrameStep(step);
        const conversation_key_text = conversation_key ? conversation_data[conversation_key] : null;
        if (conversation_key_text && conversation_key_text != "" && replayUI.convEl) {
            const displayKey = formatTimeKey(conversation_key);
            replayUI.convEl.textContent = `\n${displayKey} 对话记录：\n` + conversation_key_text;
        }

        // Moving personas
        for (let i = 0; i < Object.keys(personas).length; i++) {
            let curr_persona_name = Object.keys(personas)[i];
            let curr_persona = personas[curr_persona_name];
            let curr_pronunciatio = pronunciatios[Object.keys(personas)[i]];

            if (step in all_movement) {
                if (curr_persona_name.replace("_", " ") in all_movement[step]) {
                    if (execute_count == execute_count_max) {
                        let curr_x = all_movement[step][curr_persona_name.replace("_", " ")]["movement"][0];
                        let curr_y = all_movement[step][curr_persona_name.replace("_", " ")]["movement"][1];
                        movement_target[curr_persona_name] = [curr_x * tile_width, curr_y * tile_width];

                        let action = all_movement[step][curr_persona_name.replace("_", " ")]["action"];

                        let act = action;
                        act = act.length > 25 ? act.substring(0, 20)+"..." : act;
                        pronunciatios[curr_persona_name].setText(curr_persona_name + ": " + act);

                        // Updating the status of each personas
                        if (description_data[curr_persona_name] && description_data[curr_persona_name]["currently"] !== undefined) {
                            document.getElementById("agent_desc__"+curr_persona_name).innerHTML = description_data[curr_persona_name]["currently"];
                        }
                        document.getElementById("current_action__"+curr_persona_name).innerHTML = action;
                        document.getElementById("target_address__"+curr_persona_name).innerHTML = all_movement[step][curr_persona_name.replace("_", " ")]["location"];

                        // Health-specific: update health panel
                        updateHealthPanel(step.toString());
                        updateTimelineActive(step);
                    }

                    if (execute_count > 0) {
                        if (curr_persona.body.x < movement_target[curr_persona_name][0]) {
                            curr_persona.body.x += movement_speed;
                            anims_direction = "r";
                            pre_anims_direction = "r";
                            pre_anims_direction_dict[curr_persona_name] = "r";
                        } else if (curr_persona.body.x > movement_target[curr_persona_name][0]) {
                            curr_persona.body.x -= movement_speed;
                            anims_direction = "l";
                            pre_anims_direction = "l";
                            pre_anims_direction_dict[curr_persona_name] = "l";
                        } else if (curr_persona.body.y < movement_target[curr_persona_name][1]) {
                            curr_persona.body.y += movement_speed;
                            anims_direction = "d";
                            pre_anims_direction = "d";
                            pre_anims_direction_dict[curr_persona_name] = "d";
                        } else if (curr_persona.body.y > movement_target[curr_persona_name][1]) {
                            curr_persona.body.y -= movement_speed;
                            anims_direction = "u";
                            pre_anims_direction = "u";
                            pre_anims_direction_dict[curr_persona_name] = "u";
                        } else {
                            anims_direction = "";
                        }

                        curr_pronunciatio.x = curr_persona.body.x - 15;
                        curr_pronunciatio.y = curr_persona.body.y - 15 - 25;

                        let left_walk_name = curr_persona_name + "-left-walk";
                        let right_walk_name = curr_persona_name + "-right-walk";
                        let down_walk_name = curr_persona_name + "-down-walk";
                        let up_walk_name = curr_persona_name + "-up-walk";

                        if (anims_direction == "l") {
                            curr_persona.anims.play(left_walk_name, true);
                        } else if (anims_direction == "r") {
                            curr_persona.anims.play(right_walk_name, true);
                        } else if (anims_direction == "u") {
                            curr_persona.anims.play(up_walk_name, true);
                        } else if (anims_direction == "d") {
                            curr_persona.anims.play(down_walk_name, true);
                        }
                    }
                }
            } else {
                if (pre_anims_direction_dict[curr_persona_name] == "l") curr_persona.setTexture(curr_persona_name, "left");
                else if (pre_anims_direction_dict[curr_persona_name] == "r") curr_persona.setTexture(curr_persona_name, "right");
                else if (pre_anims_direction_dict[curr_persona_name] == "u") curr_persona.setTexture(curr_persona_name, "up");
                else if (pre_anims_direction_dict[curr_persona_name] == "d") curr_persona.setTexture(curr_persona_name, "down");
                curr_persona.anims.stop();

                finished = true;
                updateReplayUIState();
            }
        }

        if (execute_count == 0) {
            for (let i = 0; i < Object.keys(personas).length; i++) {
                let curr_persona_name = Object.keys(personas)[i];
                let curr_persona = personas[curr_persona_name];
                curr_persona.body.x = movement_target[curr_persona_name][0];
                curr_persona.body.y = movement_target[curr_persona_name][1];
            }
            execute_count = execute_count_max + 1;
            step = step + 1;

            setReplayTimeForStep(step);
        }

        execute_count -= 1;

        // Zoom display is updated continuously above
    }
</script>
